name: Mobile

# Apps de Android e iOS (mobile/, Flutter). Se compila en los PR que tocan mobile/ (sin
# publicar nada) y la llama release.yml en cada tag v* para adjuntar el APK y la IPA.
on:
  workflow_call:
    inputs:
      version:
        description: Versión sin la "v" (la del tag)
        type: string
        required: true
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Análisis y pruebas unitarias Flutter
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Version
        id: version
        run: |
          VERSION="${INPUT_VERSION#v}"
          [ -n "$VERSION" ] || VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      # Clave de firma propia (no hay cuenta de Google Play): siempre la misma, o Android no
      # instalará las versiones nuevas encima. Copia del propietario en CLAUDE_AUTH.
      - name: Signing key
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/absorconnect.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK
        run: |
          flutter build apk --release --build-name "${{ steps.version.outputs.name }}" --build-number "${{ github.run_number }}"
          mkdir -p ../dist-mobile
          cp build/app/outputs/flutter-apk/app-release.apk "../dist-mobile/absor-connect-${{ steps.version.outputs.name }}.apk"
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/absorconnect.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs ../dist-mobile/*.apk | grep -E "certificate (DN|SHA-256)"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mobile-android
          path: dist-mobile/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Análisis y pruebas unitarias Flutter
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Version
        id: version
        run: |
          VERSION="${INPUT_VERSION#v}"
          [ -n "$VERSION" ] || VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      # Sin cuenta de Apple Developer: .ipa sin firmar. AltStore, SideStore o Sideloadly la
      # firman con el Apple ID de cada persona al instalarla.
      - name: Build IPA (unsigned)
        run: |
          flutter build ios --release --no-codesign --build-name "${{ steps.version.outputs.name }}" --build-number "${{ github.run_number }}"
          mkdir -p ../dist-mobile/Payload
          cp -R build/ios/iphoneos/Runner.app ../dist-mobile/Payload/
          cd ../dist-mobile && zip -qry "absor-connect-${{ steps.version.outputs.name }}.ipa" Payload && rm -rf Payload
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mobile-ios
          path: dist-mobile/*.ipa
          if-no-files-found: error
