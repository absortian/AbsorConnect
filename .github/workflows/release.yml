name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            build_cmd: npm run build:mac
          - os: windows-latest
            build_cmd: npm run build:win
          - os: ubuntu-latest
            build_cmd: npm run build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: ${{ matrix.build_cmd }}
        env:
          # URL de la API de cuentas. Nunca vacía: Vite da prioridad a las variables del proceso
          # sobre .env.production aunque estén vacías, y la app quedaría sin servicio.
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL || 'https://absorconnect.absor.top' }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body: |
            ## Absor Connect ${{ github.ref_name }} 🚀

            Gestor de conexiones remotas de escritorio, gratuito y de código abierto: explorador de doble panel para almacenamiento compatible con S3 (AWS S3, MinIO, DigitalOcean Spaces, etc.) y servidores SSH (SFTP), terminal SSH integrada y tus conexiones guardadas en tu cuenta para usarlas en todos tus equipos.

            **Web, descargas e instrucciones de instalación:** https://absorconnect.absor.top

            ### Características
            - Cuenta gratuita: tus conexiones y carpetas en todos tus equipos
            - Explorador local y remoto en paneles duales (S3 o SFTP)
            - Conexiones SSH con contraseña o clave privada (con passphrase opcional)
            - Terminal SSH interactiva en pestañas, sobre la misma conexión
            - Arrastrar y soltar entre paneles y desde el sistema operativo
            - Cola de transferencias en tiempo real con progreso y reintento
            - Credenciales cifradas en el servicio; la sesión de cada equipo, en el almacén seguro del sistema

            > La clave de host de los servidores SSH no se verifica en esta versión; úsala en redes de confianza.

            ### Descargas
            | Plataforma | Archivo |
            |---|---|
            | macOS (Apple Silicon) | `.dmg` o `.zip` (arm64) |
            | macOS (Intel) | `.dmg` o `.zip` (x64) |
            | Windows | `-setup.exe` |
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (Fedora/RHEL) | `.rpm` |
            | Linux (Universal) | `.AppImage` |
            | Linux (Genérico) | `.tar.gz` |

            ### Cuentas en la nube (desde la v0.2.0)
            La app pide crear una cuenta gratuita (email y contraseña) o iniciar sesión, y guarda las conexiones en ella en vez de en el equipo.
            - Al iniciar sesión, ofrece subir las conexiones que tenías guardadas en el equipo. Si eliges "Ahora no", siguen en el equipo y te lo vuelve a preguntar la próxima vez.
            - Necesita conexión a internet para cargar tus conexiones.
            - En macOS y Windows la app no está firmada: la primera vez el sistema avisará. Los pasos para abrirla están en https://absorconnect.absor.top/#descargas

            ### Migración desde Absor S3 Explorer
            Absor Connect es el nuevo nombre de Absor S3 Explorer. Tus ajustes se conservan al actualizar, y tus conexiones se pueden subir a tu cuenta al iniciar sesión.
            - **Windows y Linux (deb/rpm):** la nueva versión sustituye a la anterior automáticamente.
            - **macOS:** tras instalar "Absor Connect.app" puedes borrar "Absor S3 Explorer.app" de Aplicaciones; ambas comparten los mismos datos.
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
