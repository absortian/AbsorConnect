name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            build_cmd: npm run build:mac
          - os: windows-latest
            build_cmd: npm run build:win
          - os: ubuntu-latest
            build_cmd: npm run build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: ${{ matrix.build_cmd }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body: |
            ## Absor Connect ${{ github.ref_name }} 🚀

            Gestor de conexiones remotas de escritorio: explorador de doble panel para almacenamiento compatible con S3 (AWS S3, MinIO, DigitalOcean Spaces, etc.) y servidores SSH (SFTP), y terminal SSH integrada.

            ### Características
            - Explorador local y remoto en paneles duales (S3 o SFTP)
            - Conexiones SSH con contraseña o clave privada (con passphrase opcional)
            - Terminal SSH interactiva en pestañas, sobre la misma conexión
            - Arrastrar y soltar entre paneles y desde el sistema operativo
            - Cola de transferencias en tiempo real con progreso y reintento
            - Credenciales guardadas cifradas con el almacén seguro del sistema

            > La clave de host de los servidores SSH no se verifica en esta versión; úsala en redes de confianza.

            ### Descargas
            | Plataforma | Archivo |
            |---|---|
            | macOS (Apple Silicon) | `.dmg` o `.zip` (arm64) |
            | macOS (Intel) | `.dmg` o `.zip` (x64) |
            | Windows | `-setup.exe` |
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (Fedora/RHEL) | `.rpm` |
            | Linux (Universal) | `.AppImage` |
            | Linux (Genérico) | `.tar.gz` |

            ### Migración desde Absor S3 Explorer
            Absor Connect es el nuevo nombre de Absor S3 Explorer. Tus conexiones y ajustes se conservan al actualizar.
            - **Windows y Linux (deb/rpm):** la nueva versión sustituye a la anterior automáticamente.
            - **macOS:** tras instalar "Absor Connect.app" puedes borrar "Absor S3 Explorer.app" de Aplicaciones; ambas comparten los mismos datos.
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
