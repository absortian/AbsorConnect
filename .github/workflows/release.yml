name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'electron*.yml'
      - 'electron*.ts'
      - '.github/workflows/release.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            build_cmd: npm run build:mac
          - os: windows-latest
            build_cmd: npm run build:win
          - os: ubuntu-latest
            build_cmd: npm run build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # El runner de macOS es arm64 y también empaqueta x64: npm solo instala el binario de koffi
      # del sistema donde corre, así que el de x64 se añade a mano, de la misma versión y sin
      # tocar package.json ni el lockfile (add-remote-desktop D10)
      - name: Koffi for macOS x64
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./node_modules/koffi/package.json').version")
          npm install --no-save --force --ignore-scripts --no-audit --no-fund "@koromix/koffi-darwin-x64@$VERSION"
          ls node_modules/@koromix

      - name: Validate desktop
        run: npm run typecheck && npm test

      - name: Build and package
        run: ${{ matrix.build_cmd }}
        env:
          # URL de la API de cuentas. Nunca vacía: Vite da prioridad a las variables del proceso
          # sobre .env.production aunque estén vacías, y la app quedaría sin servicio.
          MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL || 'https://absorconnect.absor.top' }}

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          body: |
            ## Absor Connect ${{ github.ref_name }} 🚀

            Gestor de conexiones remotas para escritorio, Android e iPhone, gratuito y de código abierto: explorador de doble panel para almacenamiento compatible con S3 (AWS S3, MinIO, DigitalOcean Spaces, etc.) y servidores SSH (SFTP), terminal SSH integrada, control remoto de tus PCs y tus conexiones guardadas en tu cuenta para usarlas en todos tus equipos.

            **Web, descargas e instrucciones de instalación:** https://absorconnect.absor.top

            ### Novedades 0.4.1
            - Perfil Equilibrado por defecto (hasta 1080p) y selector Fluido (hasta 720p) / Resolución original en escritorio, Android e iOS.
            - Estadísticas locales de resolución, fps, RTT, kbit/s y búfer de vídeo para diagnosticar tirones.
            - Cambios de pantalla y calidad ordenados; cierre seguro de capturas pendientes.
            - Esta versión requiere la sesión gráfica del usuario. El agente desatendido, el inicio de sesión y el control de UAC siguen en pruebas y no se habilitan con esta actualización.
            - macOS: la actualización sigue siendo manual por la firma ad-hoc. iOS: IPA sin firmar para SideStore/AltStore/Sideloadly.

            ### Características
            - Cuenta gratuita: tus conexiones y carpetas en todos tus equipos
            - Explorador local y remoto en paneles duales (S3 o SFTP)
            - Conexiones SSH con contraseña o clave privada (con passphrase opcional)
            - Terminal SSH interactiva en pestañas, sobre la misma conexión
            - Arrastrar y soltar entre paneles y desde el sistema operativo
            - Cola de transferencias en tiempo real con progreso y reintento
            - Credenciales cifradas en el servicio; la sesión de cada equipo, en el almacén seguro del sistema
            - Control remoto de tus PCs desde otro ordenador o desde el móvil: pantalla, ratón y teclado, varias pantallas, sonido, portapapeles y ficheros
            - Segundo plano: la app puede seguir en la bandeja y abrirse al iniciar sesión, para que el PC esté disponible

            > La clave de host de los servidores SSH no se verifica en esta versión; úsala en redes de confianza.

            ### Descargas
            | Plataforma | Archivo |
            |---|---|
            | macOS (Apple Silicon) | `.dmg` o `.zip` (arm64) |
            | macOS (Intel) | `.dmg` o `.zip` (x64) |
            | Windows | `-setup.exe` |
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (Fedora/RHEL) | `.rpm` |
            | Linux (Universal) | `.AppImage` |
            | Linux (Genérico) | `.tar.gz` |
            | Android 7.0+ | `.apk` |
            | iPhone y iPad (iOS 15+) | `.ipa` sin firmar, para SideStore, AltStore Classic o Sideloadly |

            ### Control remoto (desde la v0.4.0)
            - **En el PC que se va a controlar:** en Ajustes › Control remoto de este PC, crea su contraseña y activa «Permitir controlar este PC». La contraseña no sale de ese PC.
            - **Desde otro equipo de la misma cuenta:** Equipos › Conectar. En el móvil, Equipos está en la pantalla de inicio.
            - **Conexión:** directa entre los equipos cuando la red lo permite y, si no, por el relé del servicio, cifrada de extremo a extremo en los dos casos.
            - **macOS:** necesita los permisos de Grabación de pantalla y Accesibilidad (desde macOS 27, «Control de dispositivos y acceso a datos»). El sonido, desde macOS 14.2.
            - **Linux:** como PC controlado, solo con sesión X11. El sonido necesita `pactl` (`pulseaudio-utils`).
            - **Windows:** si el cortafuegos pregunta, elige «Permitir», al menos en redes privadas.

            ### Android e iPhone (desde la v0.3.0)
            Las mismas conexiones en el móvil: explorador SFTP y S3 (subir desde Archivos o Fotos, descargar y compartir) y terminal SSH con barra de teclas. Las apps no están en Google Play ni en la App Store:
            - **Android:** descarga el `.apk` y ábrelo; Android pedirá permitir instalar apps de esa fuente. La app avisa en Ajustes de las versiones nuevas.
            - **iPhone:** añade la fuente `https://github.com/absortian/AbsorConnect/releases/latest/download/altstore-source.json` en SideStore o AltStore Classic (o instala el `.ipa` con Sideloadly). Con un Apple ID gratuito la app se renueva cada 7 días. AltStore PAL (la versión de la UE sin ordenador) no sirve: solo instala apps notarizadas por Apple.
            - Las claves privadas SSH se importan en cada móvil y no se suben a la cuenta.

            Pasos detallados: https://absorconnect.absor.top/#descargas

            ### Cuentas en la nube (desde la v0.2.0)
            La app pide crear una cuenta gratuita (email y contraseña) o iniciar sesión, y guarda las conexiones en ella en vez de en el equipo.
            - Al iniciar sesión, ofrece subir las conexiones que tenías guardadas en el equipo. Si eliges "Ahora no", siguen en el equipo y te lo vuelve a preguntar la próxima vez.
            - Necesita conexión a internet para cargar tus conexiones.
            - En macOS y Windows la app no está firmada: la primera vez el sistema avisará. Los pasos para abrirla están en https://absorconnect.absor.top/#descargas

            ### Migración desde Absor S3 Explorer
            Absor Connect es el nuevo nombre de Absor S3 Explorer. Tus ajustes se conservan al actualizar, y tus conexiones se pueden subir a tu cuenta al iniciar sesión.
            - **Windows y Linux (deb/rpm):** la nueva versión sustituye a la anterior automáticamente.
            - **macOS:** tras instalar "Absor Connect.app" puedes borrar "Absor S3 Explorer.app" de Aplicaciones; ambas comparten los mismos datos.
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Apps móviles (mobile.yml) y, cuando están las de escritorio, sus ficheros en la misma
  # release. Se suben con `gh release upload` para no tocar las notas ni los latest*.yml.
  mobile:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/mobile.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  mobile-publish:
    needs: [release, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Download mobile builds
        uses: actions/download-artifact@v6
        with:
          pattern: mobile-*
          path: dist-mobile
          merge-multiple: true

      # Fuente de AltStore/SideStore (formato v2) con la última versión de la IPA. Su URL es
      # estable: releases/latest/download/altstore-source.json
      - name: AltStore source
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IPA="dist-mobile/absor-connect-$VERSION.ipa"
          python3 - "$VERSION" "$(stat -c %s "$IPA")" "${{ github.run_number }}" > dist-mobile/altstore-source.json <<'EOF'
          import json, sys
          from datetime import datetime, timezone
          version, size, build = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          description = ("Explora buckets S3 y servidores SFTP, abre terminales SSH y usa en el iPhone las mismas "
                         "conexiones que en el escritorio, con tu cuenta gratuita de Absor Connect.")
          print(json.dumps({
              "name": "Absor Connect",
              "identifier": "com.absor.connect.source",
              "subtitle": "S3, SFTP y SSH en tu iPhone",
              "description": description,
              "iconURL": "https://absorconnect.absor.top/icon.png",
              "website": "https://absorconnect.absor.top",
              "tintColor": "#6366F1",
              "nsfw": False,
              "apps": [{
                  "name": "Absor Connect",
                  "bundleIdentifier": "com.absor.connect",
                  "developerName": "Absor",
                  "subtitle": "S3, SFTP y SSH",
                  "localizedDescription": description,
                  "iconURL": "https://absorconnect.absor.top/icon.png",
                  "tintColor": "#6366F1",
                  "category": "developer",
                  "versions": [{
                      "version": version,
                      "buildVersion": build,
                      "date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "localizedDescription": f"Absor Connect {version}.",
                      "downloadURL": f"https://github.com/absortian/AbsorConnect/releases/download/v{version}/absor-connect-{version}.ipa",
                      "size": size,
                      "minOSVersion": "15.0",
                  }],
                  # Los mismos textos que mobile/ios/Runner/Info.plist
                  "appPermissions": {
                      "entitlements": [],
                      "privacy": {
                          "NSLocalNetworkUsageDescription": "Absor Connect se conecta a los servidores SSH y S3 y a los PCs de tu red local que añadas o controles.",
                          "NSMicrophoneUsageDescription": "Absor Connect no graba sonido. iOS puede pedir este permiso al reproducir el sonido de un PC durante el control remoto; puedes denegarlo.",
                          "NSPhotoLibraryUsageDescription": "Absor Connect sube a tus servidores las fotos y vídeos que elijas.",
                      },
                  },
              }],
              "news": [],
          }, ensure_ascii=False, indent=2))
          EOF
          ls -la dist-mobile

      - name: Upload to the release
        run: gh release upload "$GITHUB_REF_NAME" dist-mobile/*.apk dist-mobile/*.ipa dist-mobile/altstore-source.json --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ninguna actualización se anuncia hasta disponer de las cinco plataformas.
      - name: Publish complete release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
