name: Agent core

on:
  pull_request:
    paths:
      - 'agent/**'
      - 'src/shared/remote/auth-vectors.json'
      - 'src/shared/remote/agent-protocol-vectors.json'
      - 'prototypes/remote-desktop/webrtc-check/**'
      - 'prototypes/remote-desktop/unattended-check/**'
      - 'prototypes/backend-agent-check/**'
      - '.github/workflows/agent-core.yml'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'src/shared/remote/auth-vectors.json'
      - 'src/shared/remote/agent-protocol-vectors.json'
      - 'prototypes/remote-desktop/webrtc-check/**'
      - 'prototypes/remote-desktop/unattended-check/**'
      - 'prototypes/backend-agent-check/**'
      - '.github/workflows/agent-core.yml'

permissions:
  contents: read

# Bash con -e/pipefail también en Windows: ningún fallo nativo queda oculto
# por el éxito de un comando posterior en un paso con varias líneas.
defaults:
  run:
    shell: bash

jobs:
  authorization:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Instalar toolchain fijado
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Descargar dependencias fijadas
        run: cargo +1.85.0 fetch --manifest-path agent/Cargo.toml --locked
      - name: Formato y análisis
        run: |
          cargo +1.85.0 fmt --manifest-path agent/Cargo.toml --all --check
          cargo +1.85.0 clippy --manifest-path agent/Cargo.toml --offline --locked --all-targets --all-features -- -D warnings
      - name: Diagnóstico sin secretos
        run: |
          python agent/tools/diagnose.py --self-test
          python -B prototypes/backend-agent-check/test_mobile_protected_runner.py
          python -B prototypes/remote-desktop/unattended-check/test-linux-xauthority-fd.py
      - name: Autorización y proceso propio
        run: |
          cargo +1.85.0 test --manifest-path agent/Cargo.toml --offline --locked
          cargo +1.85.0 test --manifest-path agent/Cargo.toml --offline --locked --all-features
          cargo +1.85.0 run --manifest-path agent/Cargo.toml --offline --locked --example lease-smoke
          cargo +1.85.0 run --manifest-path agent/Cargo.toml --offline --locked --example restart-smoke
          cargo +1.85.0 build --manifest-path agent/Cargo.toml --offline --locked --release
          cargo +1.85.0 build --manifest-path agent/Cargo.toml --offline --locked --release --all-features
      - name: Binarios SCM de laboratorio con CRT estático
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo +1.85.0 build --manifest-path agent/Cargo.toml --offline --locked --release -p absor-agent-windows-session --features windows-session-lab
      - name: Conservar binarios SCM de laboratorio
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-session-lab-x86_64
          if-no-files-found: error
          retention-days: 7
          path: |
            agent/target/release/absor-win-sessiond-lab.exe
            agent/target/release/absor-win-session-worker-lab.exe
            agent/target/release/absor-win-session-monitor-lab.exe
