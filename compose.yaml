---
# Absor Connect — backend (API de cuentas y conexiones en la nube).
#
# Todos los datos persistentes viven en ./.docker/ (carpeta local, gitignorada)
# mediante bind mounts: nada de volúmenes de Docker que puedan quedar huérfanos.
#
#   Desarrollo:  docker compose up -d --wait        (aplica compose.override.yaml)
#   Producción:  Kubernetes (kube/ + docker/prod/php/Dockerfile, ver kube/AGENTS.md)
name: absorconnect

x-php-env: &php-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}

services:
  php:
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *php-env
    volumes:
      # Certificados y estado de Caddy, en ficheros locales
      - ./.docker/caddy/data:/data
      - ./.docker/caddy/config:/config

  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 5s
      retries: 10
      start_period: 10s
      timeout: 5s
    volumes:
      - ./.docker/postgres:/var/lib/postgresql/data
