---
# Entorno de DESARROLLO (docker compose lo aplica automáticamente).
# API en :8020 y Postgres en :5434: distintos de AbsorQuiz (8000/5432) y
# Politinder (8010/5433) para poder tener los proyectos levantados a la vez.
services:
  php:
    image: absorconnect-php-dev
    build:
      context: ./backend
      target: frankenphp_dev
    environment:
      # Cualquier nombre en :80: el emulador de Android llega por 10.0.2.2 y las pruebas por 127.0.0.1
      SERVER_NAME: ${SERVER_NAME:-:80}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8020}
      FRANKENPHP_WORKER_CONFIG: watch
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: "${APP_ENV:-dev}"
    volumes:
      - ./backend:/app
      - ./backend/frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./backend/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
    ports:
      - "8020:80"
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

  database:
    ports:
      # Para inspeccionar la BD desde el host (TablePlus, DBeaver…)
      - "127.0.0.1:5434:5432"

  # Node 22 y el CLI de OpenSpec para la app Electron, sin instalar Node en el host.
  # Se usa con bin/dev y bin/openspec; el profile evita que `docker compose up` lo arranque.
  node:
    image: absorconnect-node-dev
    build:
      context: ./docker/dev/node
    profiles: [tools]
    # Tu usuario (bin/dev pasa uid y gid): node_modules/ y lo que cree openspec no quedan de root
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      # Cachés de npm, Electron y electron-builder entre ejecuciones (gitignorado). No va en
      # ./.docker/ porque Docker crea esa carpeta como root al levantar el backend.
      HOME: ${PWD}/.node-home
    volumes:
      # El repo en la misma ruta que en el host: openspec devuelve rutas absolutas (changeDir,
      # resolvedOutputPath) que luego se abren fuera del contenedor. ${PWD} debe ser la raíz
      # del repo: bin/dev la fija; con `docker compose run` a mano, lánzalo desde la raíz.
      - .:${PWD}
    working_dir: ${PWD}
