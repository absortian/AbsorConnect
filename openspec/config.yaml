schema: spec-driven

context: |
  Language: Spanish
  All artifacts must be written in Spanish.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## Producto
  Absor Connect (antes "Absor S3 Explorer", repo GitHub absortian/AbsorConnect):
  app de escritorio multiplataforma (macOS arm64/x64, Windows, Linux), con
  controladores móviles Android/iOS en mobile/. Explorador de doble panel local ↔
  S3/SFTP, terminal SSH y control remoto de PCs de la cuenta mediante WebRTC.
  Las conexiones se guardan en la cuenta y sus secretos se cifran en el backend.
  El host remoto actual depende de Electron y de una sesión gráfica de usuario;
  abrir al iniciar sesión no equivale a un servicio del sistema. El acceso a UAC,
  bloqueo e inicio de sesión sigue excluido del soporte publicado hasta completar
  y verificar add-unattended-admin-access. No anunciar la propuesta como implementada.
  Cualquier cambio de nombre, ruta de datos, cifrado o canal de actualización debe
  preservar las conexiones y compatibilidad de las instalaciones existentes.

  ## Stack
  - Electron 39 + electron-vite 5 + Vite 7; React 19 + TypeScript 5.9 (renderer).
  - @aws-sdk/client-s3 (multipart y streaming para ficheros grandes).
  - electron-builder 26 (dmg/zip, NSIS, AppImage/deb/rpm/tar.gz) y electron-updater
    con provider GitHub Releases. CI: .github/workflows/release.yml al pushear tags v*.
  - i18next/react-i18next con locales en y es; iconos lucide-react; CSS propio
    (src/renderer/src/assets/main.css, tema oscuro/claro, estilo glassmorphism).
  - Backend Symfony 8.1/PHP 8.5/PostgreSQL en backend/; despliegue Kubernetes por
    Jenkins. Conservar las versiones PHP y opciones de compilación de AGENTS.md.
  - Flutter en mobile/; WebRTC en Chromium y flutter_webrtc, entrada nativa con koffi.
  - API aditiva de agente en backend/src/HostAgent/ (contrato en backend/AGENT_API.md):
    alta de un solo uso de cinco minutos, credencial de servicio distinta de la cuenta,
    traspaso exclusivo del host y revocación ligada a la sesión de origen. Desplegar
    esa API no instala un agente ni habilita acceso administrativo en clientes actuales.

  - Núcleo Rust en agent/ con gate monotónico, autenticación v1, API, auditoría y
    protocolo administrativo negociado/deduplicado. Los trabajadores actuales
    son de laboratorio: vídeo artificial o ventana propia X11 de una VM.
    No equivalen a los agentes finales SCM/launchd/systemd. El laboratorio IPC
    separa K/credencial del trabajador y prueba corte por watchdog/fin de plazo.
  - Preparación para viajes y recuperación: docs/unattended-access.md. La matriz
    certificada de servicio completo sigue vacía; una declaración de capacidades
    en la API no demuestra disponibilidad de pantallas protegidas.

  ## Arquitectura
  - src/main: proceso principal. index.ts registra los handlers ipcMain.handle;
    s3.ts, ssh.ts, localFs.ts, cloud/ (cuenta y conexiones), remote/ (host y señalización),
    background.ts (bandeja e inicio con sesión), updater.ts.
  - src/preload/index.ts expone window.api vía contextBridge; los tipos en
    src/preload/index.d.ts. Todo acceso a red/FS pasa por IPC main ↔ renderer.
  - src/shared/: tipos de conexiones y protocolo remoto v1. Cambiar el protocolo
    junto con mobile/lib/src/remote/; auth-vectors.json verifica ambos clientes.
  - src/renderer/src: interfaz React, components/, context/TransferQueueContext.tsx.
    src/renderer/host y viewer implementan las ventanas de control remoto.
  - Persistencia: conexiones en la API de la cuenta; settings/sesión/identidad y K
    del host en el perfil local con la protección correspondiente. connections.json
    solo se lee para migración. Token de cuenta y K no se entregan a los renderers.
  - Identificadores actuales: package.json name "absor-file-explorer", appId
    "com.absor.fileexplorer", productName "Absor Connect", executableName (win)
    "AbsorConnect". Conservar la identidad/ruta de datos de instalaciones previas.

  ## Convenciones
  - Canales IPC en kebab-case con prefijo de dominio (s3-*, local-*, get-/save-*).
    Cada canal nuevo: handler en main, método en preload y tipo en index.d.ts.
  - Todo texto visible al usuario va por i18n y se añade en en.json y es.json.
  - Credenciales nunca en claro en disco ni en logs. El token de cuenta permanece
    en main. El host no captura ni acepta entrada antes de autenticar al controlador.
  - Prettier + ESLint (npm run lint, npm run format). Commits estilo conventional
    (feat:, fix:, chore:).

  ## Calidad y verificación
  - Hay pruebas Vitest (npm test), PHPUnit (docker compose exec php php bin/phpunit)
    y Flutter (flutter analyze y flutter test; entorno en mobile/tool/test_env.sh).
    Puerta mínima de escritorio: npm run typecheck y npm test.
  - npm run lint arrastra deuda previa: no limpiarla de paso ni asumir un recuento
    histórico como medida actual; el código nuevo o tocado no debe añadir errores.
  - La verificación funcional es manual (npm run dev) y, cuando el cambio toca
    empaquetado, datos de usuario o updates, con builds reales por plataforma.
  - macOS se distribuye con firma ad-hoc y sin notarización. Squirrel.Mac no puede
    auto-instalar esas actualizaciones; la instalación es manual. Esa firma no
    demuestra identidad estable ni conservación de permisos de un helper privilegiado.

rules:
  proposal:
    - Incluir siempre una sección de "Fuera de alcance".
    - Indicar impacto en usuarios existentes (datos, credenciales, auto-update) aunque sea "ninguno".
  design:
    - Para cada decisión con impacto multiplataforma, detallar macOS, Windows y Linux por separado.
  tasks:
    - Agrupar por capa (main, preload, renderer, empaquetado/CI, documentación).
    - Terminar con tareas de verificación concretas (comandos o pasos manuales), incluyendo npm run typecheck y comprobar que los ficheros tocados no añaden errores de lint.
