# Límites contra abusos del registro abierto y del inicio de sesión. Se guardan
# en Postgres (pool app.rate_limiter_cache) para que el límite sea uno solo para
# todas las réplicas y no uno por pod.
framework:
    rate_limiter:
        register_ip:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            cache_pool: app.rate_limiter_cache
        # Cada intento consume y un inicio de sesión correcto lo reinicia: cuenta
        # los fallos seguidos de un email.
        login_email:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
            cache_pool: app.rate_limiter_cache
        login_ip:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
            cache_pool: app.rate_limiter_cache

        # Control remoto (add-remote-desktop D5): solicitudes de sesión de cada cuenta y
        # consultas de cada equipo, que lo normal es que lleguen cada 3 s.
        remote_request_user:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
            cache_pool: app.rate_limiter_cache
        device_poll:
            policy: sliding_window
            limit: 1
            interval: '1 second'
            cache_pool: app.rate_limiter_cache
        # Credenciales del relé de cada cuenta: una o dos por sesión (el PC y el controlador). El
        # registro es abierto, y sin límite el relé podría usarse como proxy UDP.
        ice_servers_user:
            policy: sliding_window
            limit: 120
            interval: '1 hour'
            cache_pool: app.rate_limiter_cache

    cache:
        pools:
            # Tabla cache_items (la crea la migración). En test, el rollback de
            # dama/doctrine-test-bundle la deja limpia para cada test.
            app.rate_limiter_cache:
                adapter: cache.adapter.doctrine_dbal
