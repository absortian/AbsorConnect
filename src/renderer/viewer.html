<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Absor Connect</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:"
    />
  </head>
  <body>
    <header id="toolbar">
      <strong id="pc-name"></strong>
      <span id="status"></span>
      <span class="spacer"></span>
      <select id="displays" hidden></select>
      <select id="quality" hidden></select>
      <button id="scale" type="button"></button>
      <button id="fullscreen" type="button"></button>
      <div class="menu">
        <button id="combos" type="button"></button>
        <div id="combo-list" hidden></div>
      </div>
      <button id="clipboard" type="button" hidden></button>
      <button id="send-files" type="button" hidden></button>
      <button id="download" type="button" hidden></button>
      <input id="file-input" type="file" multiple hidden />
      <button id="mute" type="button" hidden></button>
      <span id="no-audio" hidden></span>
      <button id="disconnect" type="button" class="danger"></button>
    </header>
    <aside id="agent-context" role="status" aria-live="polite" hidden>
      <strong id="agent-context-state"></strong> <span id="agent-context-hint"></span>
    </aside>
    <main id="stage" class="fit">
      <video id="video" tabindex="-1" autoplay playsinline muted></video>
    </main>
    <audio id="audio" autoplay></audio>
    <div id="drop" hidden><div id="drop-text"></div></div>
    <aside id="browser" hidden>
      <header>
        <button id="browser-up" type="button">↑</button>
        <input id="browser-path" type="text" spellcheck="false" autocomplete="off" />
        <button id="browser-close" type="button">✕</button>
      </header>
      <p id="browser-message"></p>
      <ul id="browser-list"></ul>
    </aside>
    <section id="transfers" hidden>
      <header>
        <strong id="transfers-title"></strong>
        <button id="transfers-clear" type="button"></button>
      </header>
      <ul id="transfer-list"></ul>
    </section>
    <div id="overlay">
      <form id="login">
        <h1 id="login-title"></h1>
        <p id="message"></p>
        <input id="password" type="password" autocomplete="off" />
        <button id="connect" type="submit"></button>
      </form>
    </div>
    <script type="module" src="/viewer/main.ts"></script>
  </body>
</html>
