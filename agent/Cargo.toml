[workspace]
members = ["crates/agent-core", "crates/agent-control", "crates/agent-api", "crates/agent-auth", "crates/agent-webrtc-lab", "crates/agent-supervisor", "crates/agent-x11-lab", "crates/agent-broker", "crates/agent-security"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[profile.release]
overflow-checks = true
panic = "abort"
