[package]
name = "absor-agent-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Solo el laboratorio aislado: permite su proxy HTTP loopback.
lab-http = ["absor-agent-api/lab-http"]
protected-ipc-lab = ["lab-http"]
input-lease-lab = []
ui-status-lab = ["protected-ipc-lab"]
ui-control-lab = ["ui-status-lab"]

[dependencies]
absor-agent-api = { path = "../agent-api" }
absor-agent-auth = { path = "../agent-auth" }
absor-agent-core = { path = "../agent-core" }
base64 = "=0.22.1"
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[[bin]]
name = "absor-secret-provision-lab"
path = "src/provision.rs"
required-features = ["protected-ipc-lab"]

[[bin]]
name = "absor-ipc-worker-lab"
path = "src/worker.rs"
required-features = ["protected-ipc-lab"]

[[bin]]
name = "absor-agent-status-lab"
path = "src/ui_main.rs"
required-features = ["ui-status-lab"]

[[bin]]
name = "absor-agent-control-lab"
path = "src/control_main.rs"
required-features = ["ui-control-lab"]
