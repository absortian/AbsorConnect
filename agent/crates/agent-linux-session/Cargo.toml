[package]
name = "absor-agent-linux-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
authority-lab = []

[dependencies]
absor-agent-core = { path = "../agent-core" }
absor-agent-security = { path = "../agent-security" }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[[bin]]
name = "absor-sessiond"
path = "src/main.rs"

[[bin]]
name = "absor-seat-authority-lab"
path = "src/authority_main.rs"
required-features = ["authority-lab"]
