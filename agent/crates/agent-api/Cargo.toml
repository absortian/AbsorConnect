[package]
name = "absor-agent-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Solo el laboratorio local; no habilitar en paquetes del servicio.
lab-http = []

[dependencies]
absor-agent-core = { path = "../agent-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
url = "=2.5.8"

[[example]]
name = "api-smoke"
required-features = ["lab-http"]
