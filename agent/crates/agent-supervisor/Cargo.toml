[package]
name = "absor-agent-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Lanzador de procesos artificiales; no es un servicio ni una interfaz privilegiada.
synthetic-lab = []

[dependencies]
absor-agent-core = { path = "../agent-core" }
serde_json = "=1.0.154"

[[bin]]
name = "absor-lab-supervisor"
path = "src/bin/lab.rs"
required-features = ["synthetic-lab"]

[[bin]]
name = "absor-lab-worker-fixture"
path = "src/bin/fixture.rs"
required-features = ["synthetic-lab"]
