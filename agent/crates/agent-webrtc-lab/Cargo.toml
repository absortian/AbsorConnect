[package]
name = "absor-agent-webrtc-lab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Únicamente diagnóstico: ABI ausente por omisión, API restringida a loopback.
lab-http = ["absor-agent-api/lab-http", "absor-agent-supervisor/synthetic-lab"]
# Ventana propia de la VM; ausente del servicio y de los builds normales.
native-fixture = ["lab-http", "dep:absor-agent-x11-lab"]

[target.'cfg(target_os = "linux")'.dependencies]
absor-agent-x11-lab = { path = "../agent-x11-lab", features = ["x11-lab"], optional = true }

[dependencies]
absor-agent-api = { path = "../agent-api" }
absor-agent-auth = { path = "../agent-auth" }
absor-agent-core = { path = "../agent-core" }
absor-agent-supervisor = { path = "../agent-supervisor" }
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
ring = "=0.17.14"
