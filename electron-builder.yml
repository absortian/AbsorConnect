appId: com.absor.fileexplorer
productName: Absor Connect
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Backend, app móvil, despliegue, specs y herramientas de desarrollo: viven en el mismo repo pero no van en app.asar
  - '!{backend,bin,docker,kube,openspec,mobile,prototypes,.claude,.docker,.node-home}/**'
  - '!{Jenkinsfile,compose.yaml,compose.override.yaml,AGENTS.md,CLAUDE.md,*.tsbuildinfo}'
asarUnpack:
  - resources/**
  # koffi (inyección de entrada del control remoto) y su binario nativo, en
  # @koromix/koffi-<so>-<arch>: un .node no se carga desde dentro de app.asar
  - '**/node_modules/koffi/**'
  - '**/node_modules/@koromix/**'
win:
  executableName: AbsorConnect
nsis:
  artifactName: absor-connect-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.png
  artifactName: absor-connect-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  minimumSystemVersion: '11.0'
  # Sin certificado de Apple: firma ad-hoc de todo el paquete. Sin ella el binario solo
  # lleva la firma del enlazador, el paquete no tiene recursos sellados y macOS dice que la
  # app «está dañada» en vez de ofrecer «Abrir igualmente». Con firma ad-hoc,
  # hardenedRuntime debe seguir en false (o haría falta disable-library-validation).
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    # Sonido del Mac durante el control remoto (audio 'loopback', CoreAudio Tap desde macOS 14.2).
    # Sin esta clave el sonido llega en silencio y sin error
    - NSAudioCaptureUsageDescription: Absor Connect envía el sonido de este Mac al equipo que lo controla, solo durante una sesión de control remoto que hayas permitido.
  notarize: false
dmg:
  artifactName: absor-connect-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  artifactName: absor-connect-${version}-${arch}.${ext}
  maintainer: absortian
  category: Utility
deb:
  # pactl (pulseaudio-utils) da el sonido del PC durante el control remoto; sin él, la sesión va
  # sin sonido. libxtst6, para la entrada, ya está en las dependencias por defecto.
  # libappindicator3-1 es la recomendación por defecto de electron-builder
  recommends:
    - libappindicator3-1
    - pulseaudio-utils
appImage:
  artifactName: absor-connect-${version}.${ext}
rpm:
  artifactName: absor-connect-${version}.${ext}
npmRebuild: false
toolsets:
  # NSIS 3.12: el NSIS 3.0.4.1 por defecto se cuelga (System.dll, 0xc0000005) en ~20 % de las
  # instalaciones en Windows Server 2025 / Windows 11 24H2
  nsis: '1.2.1'
publish:
  provider: github
  owner: absortian
  repo: AbsorConnect
