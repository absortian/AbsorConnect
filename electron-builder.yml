appId: com.absor.fileexplorer
productName: Absor Connect
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Backend, despliegue y specs: viven en el mismo repo pero no van en app.asar
  - '!{backend,docker,kube,openspec,.claude,.docker}/**'
  - '!{Jenkinsfile,compose.yaml,compose.override.yaml,AGENTS.md,CLAUDE.md,*.tsbuildinfo}'
asarUnpack:
  - resources/**
win:
  executableName: AbsorConnect
nsis:
  artifactName: absor-connect-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.png
  artifactName: absor-connect-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  minimumSystemVersion: '11.0'
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: absor-connect-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  artifactName: absor-connect-${version}-${arch}.${ext}
  maintainer: absortian
  category: Utility
appImage:
  artifactName: absor-connect-${version}.${ext}
rpm:
  artifactName: absor-connect-${version}.${ext}
npmRebuild: false
toolsets:
  # NSIS 3.12: el NSIS 3.0.4.1 por defecto se cuelga (System.dll, 0xc0000005) en ~20 % de las
  # instalaciones en Windows Server 2025 / Windows 11 24H2
  nsis: '1.2.1'
publish:
  provider: github
  owner: absortian
  repo: AbsorConnect
