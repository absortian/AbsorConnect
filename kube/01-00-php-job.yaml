apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: absorconnect-php
  name: absorconnect-php
  namespace: absorconnect
spec:
  template:
    metadata:
      labels:
        app: absorconnect-php
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
      - name: absortian
      containers:
      - name: absorconnect-php-job
        image: absortian/absortian:php-absorconnect-1.0.0
        imagePullPolicy: Always
        # Config y secretos de runtime (DATABASE_URL, APP_SECRET, CONNECTIONS_KEY...):
        # Secret absorconnect-env, creado desde backend/.env_prod con kube/make-env-secret.sh.
        envFrom:
        - secretRef:
            name: absorconnect-env
        env:
        - name: USING_IMAGE
          value: "php-absorconnect-1.0.0"
        command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--all-or-nothing"]
